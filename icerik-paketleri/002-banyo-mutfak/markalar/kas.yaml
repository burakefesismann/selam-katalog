ad: KAS
kisa_aciklama: Vana, paslanmaz flex hortum, PPRC ve armatür üreten Türk markası; batarya, duş seti, musluk, kollektör ve radyatör vanaları.
aciklama: |-
  KAS; vana grubu, paslanmaz flex hortumlar, PPRC ürünleri ve armatürler üreten, ISO 9001 belgeli bir Türk üreticisidir. Armatür gamında bataryalar, duş setleri ve muslukların yanı sıra yerden ısıtma kollektörleri ve radyatör vanaları da bulunur.

  ## Mağazamızda
  - Antoryum, Yasemin, Berilyum, Kardelen, Arnika ve Topaç bataryalar
  - Kuartz, Zümrüt, Safir, Elmas, Lilyum ve Raflesya duş setleri
  - Taharet, çamaşır, ara ve bahçe muslukları
  - Kollektörler, PEX bağlantı parçaları ve radyatör vanaları
web_sitesi: https://kas.com.tr
sira: 5
