ad: BTM
kisa_aciklama: İzmir merkezli bitümlü su yalıtım membranı, likit su yalıtım ve çatı kaplama ürünleri üreticisi.
aciklama: |-
  BTM; bitümlü su yalıtım membranları, kendinden yapışkanlı bantlar, bitüm esaslı likit ürünler, yeni nesil akrilik-poliüretan su yalıtım malzemeleri ve XPS ısı yalıtım levhaları üretir. Merkezi İzmir Kemalpaşa'dadır.

  ## Mağazamızda
  - Ekobit EC 2000 membran
  - Bitümer BTR 200 su bazlı bitüm emülsiyonu
  - BTMSEAL Elasto Dryroof çatı-teras su yalıtımı
web_sitesi: https://www.btm.co
