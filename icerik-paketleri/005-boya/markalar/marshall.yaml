kisa_aciklama: '1954''ten beri Türkiye''de boya üreten marka: iç-dış cephe boyaları, astarlar, sentetik boyalar ve Fit serisi.'
aciklama: |-
  Marshall Boya, 1954'te kurulan Türk boya markasıdır; bugün AkzoNobel bünyesindedir. İç ve dış cephe boyaları, astarlar, sentetik (yağlı) boyalar ve Fit serisini sunar.

  ## Mağazamızda
  - İç cephe: Silikonlu Mat, Silikonlu Özel Mat, Maximum; Tavan Boyası
  - Dış cephe: Akrikor Silikonlu+Akrilik
  - Astarlar: Akrikor Silikonlu+Örtücü, Geçiş, İzolasyon
  - Enamel yağlı boya ve antipas, sentetik tiner
  - Fit serisi
web_sitesi: https://www.marshallboya.com/tr
sira: 15
