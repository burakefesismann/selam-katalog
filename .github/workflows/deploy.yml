# Her main push'unda: derle → PDF kataloğu üret → GitHub Pages'e yayınla.
# Panelden (Sveltia CMS) yapılan kayıtlar da main'e commit olduğu için aynı yoldan yayına çıkar.
# (F4.3'te withastro/action yerine açık adımlara geçildi: derleme ile yayın paketi arasına PDF adımı girsin diye.)
name: Yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; yeni push gelirse sıradaki beklesin, yarıda kesilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v7

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Bağımlılıkları kur
        run: npm ci

      - name: Görsel önbelleği (optimize edilmiş görseller; derlemeyi hızlandırır)
        uses: actions/cache@v6
        with:
          path: node_modules/.astro
          key: astro-gorsel-${{ hashFiles('src/assets/**', 'package-lock.json') }}
          restore-keys: astro-gorsel-

      - name: Derle (tip kontrolü + site + arama dizini)
        run: npm run build

      - name: PDF kataloğu üret (dist/selam-insaat-urun-katalogu.pdf)
        run: npm run katalog:pdf
        env:
          CHROME_PATH: /usr/bin/google-chrome

      - name: Yayın paketini hazırla
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5
