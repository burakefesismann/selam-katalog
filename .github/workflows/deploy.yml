# Her main push'unda siteyi derler ve GitHub Pages'e yayınlar.
# Panelden (Sveltia CMS) yapılan kayıtlar da main'e commit olduğu için aynı yoldan yayına çıkar.
name: Yayınla (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın; yeni push gelirse sıradaki beklesin, yarıda kesilmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Kodu al
        uses: actions/checkout@v7

      - name: Derle ve yayın paketini hazırla
        uses: withastro/action@v6
        with:
          node-version: 24
          package-manager: npm
          # cache: true (varsayılan) → optimize edilmiş görseller önbellekte tutulur, derleme hızlanır

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pages'e yayınla
        id: deployment
        uses: actions/deploy-pages@v5
