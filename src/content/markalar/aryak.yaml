ad: Aryak
kisa_aciklama: "E.C.A.'nın alt markası Aryak (AR): bataryalar, el duşu takımları, duş kolonları, musluklar ve sifonlar."
aciklama: |-
  Aryak (AR), Elginkan Topluluğu'nun armatür markası E.C.A.'nın alt markasıdır. Lavabo, banyo ve eviye bataryaları, el duşu takımları, duş kolonları ve başlıkları, musluklar, ara kesme valfleri ve sifonlar sunar.

  ## Mağazamızda
  - Melia, Fast, Liona, Fine, Fia, Lite ve Lucia serisi bataryalar
  - Tuna, Dicle, Troya ve diğer el duşu takımları, duş kolonları
  - Ara, taharet ve çamaşır muslukları, ara kesme valfleri
web_sitesi: https://www.armusluk.com.tr
sira: 26
