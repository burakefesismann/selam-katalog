ad: İzocam
kisa_aciklama: "1965'ten beri yalıtım malzemesi üreten Türk markası: camyünü, taşyünü, XPS ve tesisat yalıtım ürünleri."
aciklama: |-
  İzocam, 1965'te kurulan ve Türkiye'nin ilk yalıtım malzemesi üreticisi olarak bilinen firmadır. Camyünü, taşyünü, ekstrüde polistiren (XPS) ve tesisat yalıtım ürünleri üretir. Aralık 2024'te Kayseri'de Terrawool markasıyla taşyünü üreten His Yalıtım'ı satın alarak Terrawool'u da bünyesine kattı.

  ## Mağazamızda
  - Camyünü boru kılıfları (folyolu ve folyosuz)
  - Camyünü çatı şiltesi Tip 400
  - Manto Taşyünü ve Terrawool mantolama levhaları
  - Taşyünü ara bölme levhası
  - Maxibord XPS levhalar ve parke altı levha
web_sitesi: https://www.izocam.com.tr
sira: 20
