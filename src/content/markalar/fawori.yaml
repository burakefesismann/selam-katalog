ad: Fawori
kisa_aciklama: "Betek Boya grubunun boya markası: iç cephe, tavan, astar, sentetik boyalar ve Optimix ısı yalıtım sistemi."
aciklama: |-
  Fawori, Filli Boya'nın üreticisi Betek Boya ve Kimya Sanayi'nin markasıdır. Silikonlu ve plastik iç cephe boyaları, tavan boyaları, astarlar, sentetik boyalar ve Optimix adıyla dış cephe ısı yalıtım (mantolama) sistemi sunar.

  ## Mağazamızda
  - Silikonlu Mat, Tavan Extra, Panel Kapı Boyası
  - Dönüşüm, Konsantre ve Sentetik astarlar; Sentetik Antipas
  - Optimix mantolama sistemi: levha, harçlar, file, dübel, kaplama
web_sitesi: https://www.fawori.com
sira: 20
