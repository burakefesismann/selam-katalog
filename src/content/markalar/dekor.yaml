ad: Dekor
kisa_aciklama: "Boya ve sıva aletleri markası: rulolar, malalar, ıspatulalar, kova-tekne, su terazisi ve şerit metre."
aciklama: |-
  ## Mağazamızda
  - Boya ruloları (10, 20, 25 cm), rulo yedekleri, ayarlı alüminyum sap
  - Sıvacı, alçı, seramik, derz, süngerli ve tırfıl malalar
  - Ispatulalar, macun ve sıvacı kürekleri, alçı sistresi
  - Kova, tekne, dizlik
  - Su terazileri ve şerit metreler
sira: 70
