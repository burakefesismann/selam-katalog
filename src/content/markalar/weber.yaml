ad: Weber
kisa_aciklama: Saint-Gobain grubunun yapı kimyasalları markası; sıva, seramik yapıştırıcı, zemin ve su yalıtımı ürünleri.
aciklama: |-
  Weber, Saint-Gobain grubunun yapı kimyasalları markasıdır. Türkiye'de Saint-Gobain Weber Yapı Kimyasalları (İzmir, Kemalpaşa) tarafından sunulur; hazır sıvalar, seramik yapıştırıcıları, zemin sistemleri ve su yalıtım ürünleri üretir.

  ## Mağazamızda
  - weberdress ince sıva (gri, 35 kg)
  - Weber yüzey sertleştirici (gri, 25 kg)
web_sitesi: https://www.tr.weber
sira: 12
