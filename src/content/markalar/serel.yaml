ad: Serel
kisa_aciklama: "Elginkan Topluluğu'nun seramik sağlık gereçleri markası: klozet, lavabo, gömme rezervuar, klozet kapağı ve pisuvar."
aciklama: |-
  Serel, E.C.A. ile aynı çatı altındaki (Elginkan Topluluğu) vitrifiye markasıdır; ürünleri E.C.A. SEREL sitesinde yer alır. Klozetlerinde kanalsız (Pure Wash) yıkama ve Serel Hygiene+ yüzey seçenekleri öne çıkar.

  ## Mağazamızda
  - Asma ve duvara sıfır klozetler (Nita, Rita, Sapphire, Smart, Purity, Poseidon…)
  - Tezgah üstü, etajerli ve ayaklı lavabolar
  - Gömme rezervuarlar, iç takımlar ve kumanda panelleri
  - Yavaş kapanan klozet kapakları
  - Bedensel engelli ve çocuk serisi, pisuvar ve hela taşları
web_sitesi: https://eca.com.tr/yapi/seramik-saglik-gerecleri
sira: 4
