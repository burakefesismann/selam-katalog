ad: Sika
kisa_aciklama: "1910'dan beri yapı kimyasalları üreten İsviçre kökenli marka: beton katkıları, su yalıtımı, mastik, silikon, köpük ve yapıştırıcılar."
aciklama: |-
  Sika 1910'da Kaspar Winkler tarafından kuruldu. İlk ürünü Sika-1 su geçirimsizlik katkısı, Gotthard demiryolu tünelinin su yalıtımında kullanıldı. Bugün beton katkılarından su yalıtımına, derz dolgu mastiklerinden kimyasal dübel ve poliüretan köpüklere kadar geniş bir ürün yelpazesi sunar.

  Türkiye'de uzun yıllar ABC Sealants markasıyla bilinen silikon, mastik, köpük ve yapıştırıcılar artık Sika markasıyla satılmaktadır (Sikasil, Sikaflex, Sikacryl, SikaBond, Sika Boom). Raflarda iki adın birlikte geçtiği ambalajlar görebilirsiniz.

  ## Mağazamızda
  - Beton katkıları: Sika-1, Plastocrete N, Separol W-3, Antisol E-200
  - Su yalıtımı yardımcıları: su tıkacı, SikaSwell şişen bant
  - Sika Boom köpükler, SikaBond 181, AnchorFix S1 kimyasal dübel
  - Sikasil, Sikaflex ve Sikacryl silikon ve mastikler
  - Sikafloor-3 QuartzTop yüzey sertleştirici
