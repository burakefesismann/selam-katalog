ad: Yurtbay Seramik
kisa_aciklama: Yer, duvar ve porselen karo üreten Türk seramik markası; mermer, taş, beton ve ahşap görünümlü seriler.
aciklama: |-
  Yurtbay Seramik; yer karoları, duvar karoları ve porselen karolar üretir. Ürünlerini TS EN 14411 standardına göre ürettiğini ve bu standardın test yöntemleriyle kontrol ettiğini, ISO 9001 kalite yönetim sistemi belgesine sahip olduğunu belirtir.

  ## Mağazamızda
  - Mermer görünümlü karolar (60x60, 60x120, 30x90)
  - Taş ve beton görünümlü karolar (45x45'ten 100x100'e)
  - Ahşap görünümlü karolar (15x90, 20x120, 22x85)
  - Banyo ve mutfak duvar fayansları, dekorlar, tezgah arası karolar
  - Metro, 20x20 desenli ve küçük format karolar
