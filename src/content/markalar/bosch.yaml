kisa_aciklama: Bosch'un profesyonel elektrikli el aleti ve aksesuar markası Bosch Professional; mağazamızda testere bıçakları ve matkap uçları.
aciklama: |-
  Bosch Professional, Bosch'un ustalara yönelik elektrikli el aletleri ve aksesuar markasıdır. Daire testere bıçakları, dekupaj bıçakları, delik açma testereleri ve metal delme uçları gibi geniş bir aksesuar gamı sunar.

  ## Mağazamızda
  - Sunta kesme daire testere bıçakları, 190x30 mm (24 ve 48 diş)
  - T 144 D dekupaj testere bıçağı
  - HSS metal matkap ucu
