ad: Orka
kisa_aciklama: 1994'ten beri yalnızca banyo mobilyası üreten, üretimini Düzce'de yapan banyo dolabı markası.
aciklama: |-
  Orka Banyo 1994'ten bu yana yalnızca banyo mobilyası alanında üretim yapan bir markadır; banyo dolaplarının yanında ayna ve boy dolaplarını da kapsayan koleksiyonlar sunar. Üretimini Düzce'deki tesisinde yapar.

  ## Mağazamızda
  - Moonlight, Ricato, Likya, Vento, Pure, Purus, Orbit ve Conza banyo dolapları ve boy dolapları
