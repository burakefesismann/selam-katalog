ad: Filli Boya
kisa_aciklama: "Betek Boya'nın 1993'te kurduğu boya markası: iç-dış cephe boyaları, astarlar, su yalıtımı ve Dalmaçyalı ısı yalıtım sistemleri."
aciklama: |-
  Filli Boya, Betek Boya ve Kimya Sanayi tarafından 1993'te kurulan boya markasıdır. Türkiye'nin ilk silikonlu dış cephe boyasını ve ilk renklendirme sistemini aynı yıl sunduğunu belirtir. İç ve dış cephe boyalarının yanında astarlar, harç katkıları, sürme su yalıtım ürünleri, yol çizgi boyaları ve Dalmaçyalı ısı yalıtım sistemleri üretir.

  ## Mağazamızda
  - Dış cephe: Aqusto Silan, Nucleus
  - İç cephe: Momento Max; tavan: Betakril Tavan
  - Astar ve yardımcılar: Panzer Astar, Kapatan, Bepermo, Sutut
  - Yol çizgi boyaları, Dalmaçyalı mantolama dübeli
