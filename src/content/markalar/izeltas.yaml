ad: İzeltaş
kisa_aciklama: "İzmir'de el aletleri üreten İzeltaş: pense, yan keski, kargaburun, anahtarlar, çekiç-keser, metre ve kontrol kalemleri."
aciklama: |-
  İzeltaş İzmir El Aletleri San. ve Tic. A.Ş.; pense ve boru anahtarlarından tornavida, anahtar, çekiç-keser ve ölçü aletlerine kadar el aletleri üretir. ISO 9001, ISO 14001 ve ISO 50001 yönetim sistemi belgelerine sahip olduğunu belirtir.

  ## Mağazamızda
  - Opak pense, yan keski, kargaburun, pense + kontrol kalemi seti
  - Kontrol kalemi, 6" izoleli kurbağacık
  - Keser ve şerit metreler (3 ve 5 m)
  - Makinalı pop perçin tabancası
