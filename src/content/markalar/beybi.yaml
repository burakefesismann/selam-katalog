ad: Beybi
kisa_aciklama: 1949'dan bu yana eldiven üreten Türk markası; mağazamızda nitril kaplı iş eldivenleri.
aciklama: |-
  Beybi, 1949'dan bu yana faaliyet gösterdiğini, Türkiye'nin ilk steril eldiven üreticisi olduğunu ve bugün iş eldiveni üretiminde öncü konumda bulunduğunu belirtir.

  ## Mağazamızda
  - PN3 sarı nitril kaplı iş eldiveni (10 no)
  - Zebra mavi-siyah nitril kaplı iş eldiveni
