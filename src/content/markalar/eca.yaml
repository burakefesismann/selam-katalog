ad: ECA
kisa_aciklama: "Elginkan Topluluğu'nun yapı markası: bataryalar, duş sistemleri, musluklar, banyo aksesuarları ve ısıtma ürünleri."
aciklama: |-
  E.C.A. (resmi yazımıyla), Elginkan Topluluğu'nun yapı ve ısıtma markasıdır; topluluk şirketi Elmor 1955'ten beri faaliyet gösteriyor. Vitrifiye markası Serel ile birlikte "E.C.A. SEREL" çatısı altında armatür, banyo aksesuarı ve seramik sağlık gereçleri sunuyor. Türkiye'nin ilk su tasarruflu batarya serisi MIX2000'i 1999'da pazara sunan da E.C.A. oldu.

  ## Mağazamızda
  - Lavabo, banyo ve eviye bataryaları (Tiera, Nita, Luna, Dalia, Lia, Myra, Niobe, Spylos…)
  - Ankastre bataryalar ve duş sistemleri, duş setleri ve tepe duşları
  - Ara, taharet ve çamaşır muslukları
  - E.C.A.'nın alt markası Aryak (AR) bataryaları, duş setleri ve muslukları
  - Lale, Rita, Star ve Diagonal serisi banyo aksesuarları
  - Yerden ısıtma kollektörleri ve PEX bağlantılı radyatör vanaları
