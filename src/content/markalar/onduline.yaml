ad: Onduline
kisa_aciklama: Hafif çatı kaplama levhaları, bitümlü su yalıtım membranları ve çatı aksesuarları; Türkiye'de Onduline Avrasya.
aciklama: |-
  Onduline, bitüm esaslı hafif çatı kaplama levhaları ile tanınan uluslararası bir markadır. Türkiye'de Onduline Avrasya olarak çatı levhaları, BITULINE ve BITUSMART bitümlü membranlar (Sapanca'da üretilir), kiremit altı örtüler, temel koruma ürünleri ve çatı aksesuarları sunar.

  ## Mağazamızda
  - BITULINE ve BITUSMART membranlar, Bitüline astar
  - Ondulikit likit su yalıtımı
  - Mahya, çivi, Ondubant ve İsobant bantlar
  - Fondaline temel koruma levhası
