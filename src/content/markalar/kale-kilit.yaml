ad: Kale Kilit
kisa_aciklama: "Kale Endüstri Holding'e bağlı kilit üreticisi: kilit, silindir, asma kilit, çelik kapı ve çelik kasa. Mağazamızda asma kilitler."
aciklama: |-
  Kale Kilit, ürünlerini kendi mühendislerinin yerli Ar-Ge çalışmalarıyla geliştirip Çerkezköy fabrikasında ürettiğini, günde 150.000 kilit ve 80.000 silindir ürettiğini belirtir. Kale şirketleri 1988'de Kale Endüstri Holding çatısı altında toplanmıştır.

  ## Mağazamızda
  - Asma kilitler: 32, 38 ve 63 mm
web_sitesi: https://www.kalekilit.com.tr
sira: 10
