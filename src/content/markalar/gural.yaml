ad: Güral
kisa_aciklama: "Kütahya merkezli Güral'ın vitrifiye markası Güral Vit: klozet, lavabo ve banyo aksesuarları."
aciklama: |-
  Güral Vit, Kütahya'da seramik sağlık gereçleri (vitrifiye) üretir; gamında Carmina, Jade, Mare, Uno ve Arya gibi seriler, bedensel engelli serisi ve Quare gibi banyo aksesuarı serileri bulunur.

  ## Mağazamızda
  - Asma klozetler (Carmina, Jade, Mare, Uno)
  - Lavabolar ve ayakları (Arya, Carmina, oval ve tezgah altı modeller)
  - Quare serisi banyo aksesuarları
